<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つなぐ薬局・はぐくみ薬局グループ | ご紹介</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --main-color: #1a2a4a;
    --accent-color: #2563EB;
    --bg-color: #F0F4FF;
    --white: #ffffff;
    --text-color: #1E293B;
    --muted: #64748B;
    --border-color: #E2E8F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 32px 20px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .logo-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--main-color);
    letter-spacing: 0.02em;
  }
  header .sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  #primary-link {
    margin-bottom: 20px;
  }
  .store-card {
    background: var(--white);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(26, 42, 74, 0.08);
    border: 1px solid var(--border-color);
  }
  .store-card h2 {
    font-size: 18px;
    margin: 0 0 8px;
    color: var(--main-color);
  }
  .store-card .line {
    font-size: 14px;
    color: var(--text-color);
    margin: 4px 0;
    line-height: 1.5;
  }
  .store-card .muted-note {
    font-size: 12px;
    color: var(--muted);
  }
  .section-box {
    background: var(--white);
    border: 2px solid var(--accent-color);
    border-radius: 16px;
    padding: 20px 18px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--main-color);
    text-align: center;
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }
  .btn-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn, span.btn-disabled {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 12px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: var(--accent-color);
    min-height: 52px;
    text-align: center;
    transition: opacity 0.15s ease;
  }
  a.btn-primary {
    background: var(--main-color);
    font-size: 17px;
    font-weight: 700;
  }
  a.btn:active { opacity: 0.8; }
  span.btn-disabled {
    background: var(--border-color);
    color: var(--muted);
    cursor: default;
    font-weight: 500;
    font-size: 14px;
  }
  .icon { font-size: 18px; }
  .notice {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 12px 0;
  }
  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo-text" id="company-name">つなぐ薬局・はぐくみ薬局グループのご紹介</div>
      <div class="sub">名刺・二次元コードからのご案内ページ</div>
    </header>

    <div id="primary-link"></div>

    <div id="store-section"></div>

    <div id="sections"></div>

    <footer>&copy; ワイズ株式会社</footer>
  </div>

<script>
(function () {
  "use strict";

  // ── 安全な描画ヘルパー（innerHTML/document.writeは使わない） ─────────────
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function isPlaceholder(url) {
    return typeof url !== "string" || url.indexOf("TBD_") === 0 || url.length === 0;
  }

  function makeLinkButton(iconText, labelText, url, variant) {
    if (isPlaceholder(url)) {
      var disabled = el("span", "btn-disabled");
      disabled.appendChild(el("span", "icon", iconText || ""));
      disabled.appendChild(document.createTextNode(" " + labelText + "（準備中）"));
      return disabled;
    }
    var a = document.createElement("a");
    a.className = variant === "primary" ? "btn btn-primary" : "btn";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.appendChild(el("span", "icon", iconText || ""));
    a.appendChild(document.createTextNode(" " + labelText));
    return a;
  }

  function renderPrimaryLink(link) {
    if (!link) return;
    var wrap = document.getElementById("primary-link");
    wrap.appendChild(makeLinkButton(link.icon, link.label, link.url, "primary"));
  }

  function renderStoreCard(store) {
    var section = document.getElementById("store-section");
    var card = el("div", "store-card");
    card.appendChild(el("h2", null, store.name || "店舗情報"));
    if (store.address) {
      card.appendChild(el("div", "line", "📍 " + store.address));
    }
    if (store.tel && !isPlaceholder(store.tel)) {
      var telLine = el("div", "line");
      var telA = document.createElement("a");
      telA.href = "tel:" + store.tel.replace(/[^0-9+]/g, "");
      telA.textContent = "☎ " + store.tel;
      telA.style.color = "inherit";
      telLine.appendChild(telA);
      card.appendChild(telLine);
    }
    if (store.pageUrl && !isPlaceholder(store.pageUrl)) {
      var pageWrap = el("div", "line");
      pageWrap.style.marginTop = "10px";
      pageWrap.appendChild(makeLinkButton("🏬", "店舗ページを見る", store.pageUrl));
      card.appendChild(pageWrap);
    }
    section.appendChild(card);
  }

  function renderSections(sections) {
    var container = document.getElementById("sections");
    (sections || []).forEach(function (section) {
      var box = el("div", "section-box");
      box.appendChild(el("h3", "section-title", section.title || ""));
      var btnList = el("div", "btn-list");
      (section.links || []).forEach(function (item) {
        btnList.appendChild(makeLinkButton(item.icon, item.label, item.url));
      });
      box.appendChild(btnList);
      container.appendChild(box);
    });
  }

  function safeResolveStoreKey(paramValue, storesMap) {
    // 反射型XSS対策: ?s= の値は「既知storeKeyとの完全一致」照合にのみ使う。
    // DOMへ値そのものを差し込むことは一切しない（Object.prototype等の汚染も
    // hasOwnProperty経由で除外する）。
    if (typeof paramValue !== "string") return null;
    if (!Object.prototype.hasOwnProperty.call(storesMap || {}, paramValue)) return null;
    return paramValue;
  }

  function init(data) {
    if (data.company && (data.company.displayTitle || data.company.name)) {
      document.getElementById("company-name").textContent = data.company.displayTitle || data.company.name;
    }

    renderPrimaryLink(data.primaryLink);

    var params = new URLSearchParams(window.location.search);
    var requestedKey = params.get("s");
    var resolvedKey = safeResolveStoreKey(requestedKey, data.stores);

    if (resolvedKey) {
      renderStoreCard(data.stores[resolvedKey]);
    }
    // 不明キー・パラメータなしの場合はデフォルト（店舗カードを出さず、
    // 公式HPボタンと研修コンテンツ枠のみのトップページ相当）にフォールバックする。

    renderSections(data.sections);
  }

  fetch("links.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("links.json fetch failed: " + res.status);
      return res.json();
    })
    .then(init)
    .catch(function (err) {
      var wrap = document.getElementById("sections");
      wrap.appendChild(el("div", "notice", "リンク情報の読み込みに失敗しました。時間をおいて再度お試しください。"));
      // eslint-disable-next-line no-console
      console.error(err);
    });
})();
</script>
</body>
</html>
